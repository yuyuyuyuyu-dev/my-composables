version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 1
    groups:
      kotlin:
        patterns:
          - org.jetbrains.kotlin:*
          - org.jetbrains.kotlin.*
        update-types: [minor, patch]
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 1
    groups:
      minor-and-patch:
        update-types: [minor, patch]

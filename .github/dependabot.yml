version: 2

updates:
  # This library went unmaintained for a while and drifted far behind, so the
  # updates are grouped into a single weekly pull request to keep them reviewable.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle-dependencies:
        patterns: [ '*' ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: [ '*' ]

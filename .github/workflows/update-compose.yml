name: Update Compose Multiplatform
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}
jobs:
  regenerate:
    name: Pick the versions and regenerate the lock files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.catalog.outputs.changed }}
      compose: ${{ steps.versions.outputs.compose }}
      material3: ${{ steps.versions.outputs.material3 }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Pick the versions
        id: versions
        run: python3 .github/scripts/pick_compose_versions.py >> "$GITHUB_OUTPUT"
      - name: Update the version catalog
        id: catalog
        env:
          COMPOSE: ${{ steps.versions.outputs.compose }}
          MATERIAL3: ${{ steps.versions.outputs.material3 }}
        run: |
          sed -i -e "s/^composeMultiplatform = \".*\"$/composeMultiplatform = \"${COMPOSE}\"/" -e "s/^material3 = \".*\"$/material3 = \"${MATERIAL3}\"/" gradle/libs.versions.toml
          if [ -n "$(git status --porcelain -- gradle/libs.versions.toml)" ]; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up JDK
        if: steps.catalog.outputs.changed == 'true'
        uses: ./.github/actions/setup-jdk
      - name: Regenerate the lock files
        if: steps.catalog.outputs.changed == 'true'
        run: ./gradlew kotlinUpgradeYarnLock kotlinWasmUpgradeYarnLock
      - name: Upload the changes
        if: steps.catalog.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: compose-update
          path: |
            gradle/libs.versions.toml
            kotlin-js-store/yarn.lock
            kotlin-js-store/wasm/yarn.lock
          if-no-files-found: error
          retention-days: 1
  publish:
    name: Open, update or close the pull request
    needs: regenerate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      BRANCH: chore/update-compose
      TITLE: 'build(deps): update Compose Multiplatform to ${{ needs.regenerate.outputs.compose }} and material3 to ${{ needs.regenerate.outputs.material3 }}'
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download the changes
        if: needs.regenerate.outputs.changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: compose-update
      - name: Mint a token for the app
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.PR_BOT_APP_ID }}
          private-key: ${{ secrets.PR_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Open, update or close the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          pr="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number')"
          if [ -z "$(git status --porcelain -- gradle/libs.versions.toml kotlin-js-store)" ]; then
            if [ -n "$pr" ]; then
              gh pr close "$pr" --delete-branch --comment 'Compose Multiplatform and material3 on main are already up to date.'
            fi
            exit 0
          fi
          user_id="$(gh api "/users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          gh auth setup-git
          git switch --create "$BRANCH"
          git add gradle/libs.versions.toml kotlin-js-store
          git commit --message "$TITLE"
          if [ -n "$pr" ] && git fetch origin "$BRANCH" && git diff --quiet HEAD FETCH_HEAD; then
            exit 0
          fi
          git push --force origin "$BRANCH"
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --title "$TITLE"
          else
            url="$(gh pr create --base main --head "$BRANCH" --title "$TITLE" --body 'Moves Compose Multiplatform to its latest stable release, and material3 to the latest version on the same line that asks for no newer Compose than that release.')"
            gh pr merge --auto --squash "$url"
          fi

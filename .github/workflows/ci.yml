name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions: {}
jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Run actionlint
        uses: raven-actions/actionlint@v2
  biome:
    name: Biome
    permissions:
      contents: read
    uses: yuyuyuyuyu-dev/repo-config/.github/workflows/biome.yml@main
  kotlin-lint:
    name: Kotlin lint
    permissions:
      contents: read
    uses: yuyuyuyuyu-dev/repo-config/.github/workflows/kotlin-lint.yml@main
    with:
      compose-multiplatform: true
  build:
    name: Build
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up the JDK and Gradle
        uses: yuyuyuyuyu-dev/repo-config/.github/actions/setup-jdk-and-gradle@main
        with:
          compose-multiplatform: true
      # `assemble` builds every target twice, once debug and once release, and
      # the release half is what costs: linkReleaseFrameworkIosArm64 alone ran
      # for nearly four hours on this runner. Measured locally with the caches
      # off, the release variants take about ten times as long as the debug
      # ones. Every target is still built, so a target that stops compiling is
      # still caught here rather than at release time.
      - name: Assemble
        run: >-
          ./gradlew :library:assemble :desktopApp:assemble :androidApp:assembleDebug :webApp:jsBrowserDevelopmentWebpack :webApp:wasmJsBrowserDevelopmentWebpack :shared:linkDebugFrameworkIosArm64 :shared:linkDebugFrameworkIosSimulatorArm64
  test:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: jvm
            os: ubuntu-latest
            task: jvmTest
          - target: wasmJs
            os: ubuntu-latest
            task: wasmJsTest
          - target: iosSimulatorArm64
            os: macos-latest
            task: iosSimulatorArm64Test
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Set up the JDK and Gradle
        uses: yuyuyuyuyu-dev/repo-config/.github/actions/setup-jdk-and-gradle@main
        with:
          compose-multiplatform: true
      - name: Start sampling memory and CPU
        run: |
          (
            set +e
            while true; do
              if [ "$RUNNER_OS" = macOS ]; then
                echo "T $(perl -MTime::HiRes=time -e 'printf q(%d), time*1000') level=$(sysctl -n kern.memorystatus_level) load=$(sysctl -n vm.loadavg) swap=$(sysctl -n vm.swapusage)"
                vm_stat | grep -E "Pages free|Pageins|Pageouts|Swapins|Swapouts|occupied by compressor"
              else
                echo "T $(date +%s%3N) load=$(cut -d ' ' -f 1-3 /proc/loadavg) $(free -m | awk '/^Mem:/ { printf "memUsed=%sM memAvailable=%sM ", $3, $7 } /^Swap:/ { printf "swapUsed=%sM", $3 }')"
                grep -E "^(pswpin|pswpout|pgmajfault) " /proc/vmstat
              fi
              ps -A -o pid=,%cpu=,rss=,comm= | sort -k2 -nr | head -n 6
              sleep 1
            done
          ) > "$RUNNER_TEMP/sampler.log" 2>&1 &
      - name: Run tests
        run: ./gradlew "$TASK"
        env:
          TASK: ${{ matrix.task }}
      - name: Upload measurements
        if: "!cancelled()"
        uses: actions/upload-artifact@v7
        with:
          name: measurements-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/sampler.log
            build/wasm/packages/MyComposables-library-test/measurement/marks.log
            library/build/test-results/
          retention-days: 7
      - name: Upload test results
        # Kept on failure so the reports explain what broke.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.target }}
          path: "**/build/reports/tests/"
          retention-days: 7

name: Publish
on:
  release:
    # `prereleased` does not fire for a pre-release published from a draft, and
    # the GitHub UI saves a release as a draft on its own. `published` covers
    # releases and pre-releases alike, however they were created.
    types: [published]
# The signing key and the Maven Central token are readable by every step, so the
# token this workflow carries is narrowed to what the checkout needs.
permissions:
  contents: read
jobs:
  publish:
    name: Release build and publish
    # macOS is required to build the Apple targets.
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Set up JDK
        uses: ./.github/actions/setup-jdk
      # Releases the deployment outright rather than leaving it for a manual
      # click in the Central Portal, since creating the GitHub release is
      # already the deliberate go-ahead.
      #
      # The tag carries the version, with an optional `v` stripped off, so the
      # build cannot disagree with the release it was cut from. Re-running a
      # version that is already on Maven Central is rejected there.
      #
      # The publishing plugin does not support the configuration cache, which
      # gradle.properties turns on for every build.
      - name: Publish to Maven Central
        run: ./gradlew :library:publishAndReleaseToMavenCentral -PlibraryVersion="${TAG#v}" --no-configuration-cache
        env:
          TAG: ${{ github.event.release.tag_name }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          # No key id is passed. It is optional, and one that does not match the
          # key below leaves the signing task with no signatory at all rather
          # than falling back to the key it was handed.
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}

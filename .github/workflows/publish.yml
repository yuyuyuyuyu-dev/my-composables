name: Publish
on:
  release:
    types: [released, prereleased]
# The signing key and the Maven Central token are readable by every step, so the
# token this workflow carries is narrowed to what the checkout needs.
permissions:
  contents: read
jobs:
  publish:
    name: Release build and publish
    # macOS is required to build the Apple targets.
    runs-on: macos-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v5
      - name: Set up JDK
        uses: ./.github/actions/setup-jdk
      # A version already on Maven Central can never be replaced, so a tag that
      # disagrees with the version being built has to fail before the upload
      # rather than leave the wrong number published for good.
      - name: Check the release tag matches the library version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version="$(./gradlew -q :library:properties --property version --no-configuration-cache | awk '/^version:/ { print $2 }')"
          if [ "${TAG#v}" != "$version" ]; then
            echo "Release tag $TAG does not match the library version $version." >&2
            exit 1
          fi
      # Releases the deployment outright rather than leaving it for a manual
      # click in the Central Portal, since creating the GitHub release is
      # already the deliberate go-ahead.
      #
      # The publishing plugin does not support the configuration cache, which
      # gradle.properties turns on for every build.
      - name: Publish to Maven Central
        run: ./gradlew :library:publishAndReleaseToMavenCentral --no-configuration-cache
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_KEY_CONTENTS }}

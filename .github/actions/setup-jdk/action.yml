name: Set up JDK
description: Sets up the JetBrains Runtime and the Gradle build environment.
inputs:
  java-version:
    description: The Java version to set up.
    required: false
    default: '21'
runs:
  using: composite
  steps:
    - name: Set up JetBrains Runtime
      uses: actions/setup-java@v5
      with:
        distribution: jetbrains
        java-version: ${{ inputs.java-version }}
      # The JetBrains installer looks up the release through the GitHub API, and
      # in v5 it reads the token from the environment only, never from the
      # token input. Without this the request is unauthenticated and runs into
      # the rate limit for the runner's address.
      env:
        GITHUB_TOKEN: ${{ github.token }}
    # This also validates the checksum of the wrapper jar, which is on by default.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v5

name: Set up JDK
description: Sets up the JDK and the Gradle build environment.
inputs:
  java-version:
    description: The Java version to set up.
    required: false
    default: '21'
runs:
  using: composite
  steps:
    # Azul to match toolchainVendor in gradle/gradle-daemon-jvm.properties.
    # On any other vendor Gradle downloads an Azul JDK of its own to run the
    # daemon on, leaving the one installed here to do nothing but launch the
    # wrapper.
    - name: Set up Zulu
      uses: actions/setup-java@v5
      with:
        distribution: zulu
        java-version: ${{ inputs.java-version }}
    # This also validates the checksum of the wrapper jar, which is on by default.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v5

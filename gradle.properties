#Kotlin
kotlin.code.style=official
# The JS and wasmJs test executables are linked in one daemon and are compiled
# in parallel by `allTests`, which ran out of heap at 3072M.
kotlin.daemon.jvmargs=-Xmx5120M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Not dependency versions, so they live here rather than in the version catalog.
compileSdk=36
minSdk=24
targetSdk=36
#Kotlin
kotlin.code.style=official
# The JS and wasmJs test executables are linked in one daemon and are compiled
# in parallel by `allTests`, which ran out of heap at 3072M.
kotlin.daemon.jvmargs=-Xmx5120M

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

# Not dependency versions, so they live here rather than in the version catalog.
compileSdk=36
minSdk=24
targetSdk=36

# Replaced with the release tag by the publish workflow, so this value only ever
# labels builds that are not releases. The suffix keeps such a build from being
# mistaken for a released one and routes a local publish to the snapshot
# repository.
libraryVersion=0.1.0-SNAPSHOT